name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main # 当推送到 main 分支时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 使用 Node.js 20 LTS 版本

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest # 安装最新版本 Bun

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Set Cloudflare Pages Project Name
        id: set_project_name
        run: echo "PROJECT_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check and Create Cloudflare Pages Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ steps.set_project_name.outputs.PROJECT_NAME }}
        run: |
          # Check if project exists
          PROJECT_STATUS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}" \
          -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
          -H "Content-Type: application/json" | jq -r '.success')

          if [ "$PROJECT_STATUS" = "false" ]; then
            echo "Cloudflare Pages project ${PROJECT_NAME} does not exist. Creating it..."
            CREATE_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "name": "'"${PROJECT_NAME}"'",
              "build_config": {
                "build_command": "bun install && bun run build",
                "destination_dir": "dist",
                "root_directory": ""
              },
              "deployment_configs": {
                "production": {
                  "compatibility_date": "2023-01-01"
                }
              },
              "source": {
                "type": "github",
                "config": {
                  "owner": "${{ github.repository_owner }}",
                  "repo_name": "${{ github.event.repository.name }}",
                  "production_branch": "main",
                  "deploy_hooks": {
                    "production": {
                      "branch": "main"
                    }
                  }
                }
              }
            }')

            if echo "$CREATE_RESULT" | jq -e '.success == true' > /dev/null; then
              echo "Project ${PROJECT_NAME} created successfully."
            else
              echo "Failed to create project ${PROJECT_NAME}."
              echo "$CREATE_RESULT"
              exit 1
            fi
          else
            echo "Cloudflare Pages project ${PROJECT_NAME} already exists."
          fi
          
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ steps.set_project_name.outputs.PROJECT_NAME }} # Use dynamically set project name
          directory: dist # 你的构建输出目录
          # Optionally, you can set a specific commit hash for the deployment
          # commitHash: ${{ github.sha }}
