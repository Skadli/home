name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main # 当推送到 main 分支时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25' # 使用 Node.js 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest # 安装最新版本 Bun

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: your-project-name # 替换为你的 Cloudflare Pages 项目名称
          directory: dist # 你的构建输出目录
          # Optionally, you can set a specific commit hash for the deployment
          # commitHash: ${{ github.sha }}
